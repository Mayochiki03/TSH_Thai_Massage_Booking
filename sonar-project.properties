# =====================================================================
# SonarQube — สแกนคุณภาพโค้ด (ใช้กับ SonarQube ใน DevOps lab)
#
# ห้ามใส่ token ในไฟล์นี้ (ไฟล์นี้ขึ้น GitHub) — ส่ง token ตอนรันเท่านั้น:
#   (cd backend && npm run test:coverage ก่อน)
#   npx sonarqube-scanner "-Dsonar.host.url=http://192.168.56.128:9000" "-Dsonar.login=<token>"
#   (SonarQube 9.9 ใช้ sonar.login — ใน PowerShell ต้องครอบ -D... ด้วย " ")
# =====================================================================
sonar.projectKey=thai-massage-booking
sonar.projectName=Thai Massage Booking
sonar.projectVersion=0.8.1

sonar.sources=backend/src,frontend/src
sonar.sourceEncoding=UTF-8

# ไม่สแกนของที่ไม่ใช่โค้ดเรา / ไฟล์ที่ build ออกมา
sonar.exclusions=**/node_modules/**,**/dist/**,**/*.min.js,frontend/public/**

# ---------------------------------------------------------------------
# Test + coverage
#   ก่อนสแกน: cd backend && npm run test:coverage   → backend/coverage/lcov.info
# ---------------------------------------------------------------------
sonar.tests=backend/test
sonar.javascript.lcov.reportPaths=backend/coverage/lcov.info

# frontend ไม่นับ coverage: test ของเราเป็น integration test ยิง API (วัดได้เฉพาะโค้ด backend)
# หน้าจอ React ทดสอบด้วยการเปิดเบราว์เซอร์จริงแทน — Bug / ช่องโหว่ / Code Smell ของ frontend ยังสแกนตามปกติ
sonar.coverage.exclusions=frontend/**
